<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Démo — Service CAPTCHA WURI</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; color: #1f2937; }
  h1 { font-size: 20px; color: #1F3864; }
  img { border: 1px solid #ccc; border-radius: 6px; display: block; margin: 12px 0; }
  input { padding: 8px; font-size: 16px; width: 140px; text-transform: uppercase; }
  button { padding: 8px 14px; font-size: 15px; margin-left: 8px; cursor: pointer; }
  #result { margin-top: 14px; font-weight: bold; }
  .ok { color: #15803d; }
  .ko { color: #b91c1c; }
  a { color: #2E74B5; }
</style>
</head>
<body>
  <h1>Démo — Service CAPTCHA WURI (prototype)</h1>
  <p>Cette page appelle directement l'API locale du service (<code>/captcha/generate</code> puis <code>/captcha/verify</code>).</p>

  <img id="captcha-img" alt="Défi CAPTCHA" width="260" height="90">
  <button id="refresh-btn" type="button">🔄 Nouveau défi</button>

  <div style="margin-top:16px;">
    <input id="answer-input" type="text" placeholder="Votre réponse" maxlength="5">
    <button id="verify-btn" type="button">Vérifier</button>
  </div>

  <div id="result"></div>

  <script>
    const API_BASE = ""; // même origine que la page (servie par le service lui-même)
    let currentChallengeId = null;

    async function loadChallenge() {
      document.getElementById("result").textContent = "";
      document.getElementById("answer-input").value = "";
      const resp = await fetch(`${API_BASE}/captcha/generate`);
      const data = await resp.json();
      currentChallengeId = data.challenge_id;
      document.getElementById("captcha-img").src = "data:image/png;base64," + data.image_base64;
    }

    async function verifyAnswer() {
      const answer = document.getElementById("answer-input").value;
      const resp = await fetch(`${API_BASE}/captcha/verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ challenge_id: currentChallengeId, answer }),
      });
      const data = await resp.json();
      const resultEl = document.getElementById("result");
      if (data.valid) {
        resultEl.textContent = "✅ Validé — jeton : " + data.validation_token.slice(0, 24) + "…";
        resultEl.className = "ok";
      } else {
        resultEl.textContent = "❌ Réponse invalide ou défi expiré. Un nouveau défi va être généré.";
        resultEl.className = "ko";
        setTimeout(loadChallenge, 1200);
      }
    }

    document.getElementById("refresh-btn").addEventListener("click", loadChallenge);
    document.getElementById("verify-btn").addEventListener("click", verifyAnswer);
    loadChallenge();
  </script>
</body>
</html>
